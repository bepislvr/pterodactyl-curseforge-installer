# Registers the client UI page as a server subpage.
# Key names follow Blueprint's components.yml format as I remember it; verify against the docs.
Components:
  Navigation:
    NavigationBar:
      - ""
  Router:
    Server:
      - path: "/modpack-installer"
        name: "Modpack Installer"
        component: "ModpackInstaller"
        permission: "file.create"
