info:
  name: "CurseForge Modpack Installer"
  identifier: "modpackinstaller"
  description: "Install CurseForge modpack server packs onto a Minecraft server from the server page."
  flags: ""
  version: "0.1.0"
  # Latest Blueprint release at time of writing (supports Pterodactyl 1.15.x).
  # A mismatch only produces a warning, but keep it in sync with the panel you test on.
  target: "beta-2026-08"
  author: "you@example.com"
  # No icon file ships yet. A non-empty value that points to a missing file is a fatal install error.
  icon: ""
  website: ""

admin:
  view: "admin/view.blade.php"
  controller: "admin/controller.php"
  css: ""
  wrapper: ""

dashboard:
  css: ""
  wrapper: ""
  # A DIRECTORY containing Components.yml and the .tsx files it references.
  components: "dashboard"

data:
  directory: ""
  public: ""
  console: ""

requests:
  views: ""
  # Directory is symlinked to app/BlueprintFramework/Extensions/modpackinstaller.
  # PHP files in it use the literal namespace Pterodactyl\BlueprintFramework\Extensions\modpackinstaller.
  # Do not use the {appcontext} placeholder: on beta-2026-08 GNU sed eats its backslashes (see CLAUDE.md).
  app: "app"
  routers:
    application: ""
    # Mounted under /api/client/extensions/modpackinstaller
    client: "routers/client.php"
    web: ""
